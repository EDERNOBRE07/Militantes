<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Militância São José - Gestão e Monitoramento de Campanha</title>
    <meta name="description" content="Sistema Integrado de Gestão de Militância e Cobertura Territorial - São José, SC" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script>
      function triggerErrorUI(errMessage) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('carregando') !== -1 || root.innerHTML.indexOf('Carregando') !== -1)) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f8fafc;">' +
            '<div style="max-width:520px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);text-align:center;">' +
              '<div style="width:48px;height:48px;border-radius:12px;background:#fef2f2;color:#dc2626;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:24px;font-weight:bold;">!</div>' +
              '<h2 style="margin:0 0 8px;font-size:18px;color:#0f172a;font-weight:700;">Instrução de Publicação na Hostinger</h2>' +
              '<p style="margin:0 0 16px;font-size:13px;color:#64748b;line-height:1.5;">Se você enviou o arquivo ZIP do projeto para a Hostinger, certifique-se de fazer o upload dos arquivos que estão dentro da pasta <strong>dist</strong> (gerados pelo comando <code>npm run build</code>) juntamente com o arquivo <strong>.htaccess</strong>.</p>' +
              '<div style="background:#f1f5f9;border-radius:8px;padding:12px;text-align:left;font-family:monospace;font-size:11px;color:#334155;margin-bottom:16px;word-break:break-all;max-height:120px;overflow:auto;">' +
                (errMessage || 'Aguardando inicialização dos scripts') +
              '</div>' +
              '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
                '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="padding:10px 16px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Limpar Cache & Recarregar</button>' +
                '<button onclick="location.reload();" style="padding:10px 16px;background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Tentar Novamente</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }
      }
      window.addEventListener('error', function(e) {
        triggerErrorUI(e.message || 'Erro de carregamento do script');
      });
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && (root.innerHTML.indexOf('Carregando módulos') !== -1 || root.innerHTML.indexOf('carregando') !== -1)) {
          triggerErrorUI('Tempo limite excedido. Para funcionar na Hostinger, envie os arquivos da pasta dist/ compilada (index.html, pasta assets e .htaccess).');
        }
      }, 7000);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding:20px;text-align:center;">
        <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;"></div>
        <h2 style="margin:0 0 6px;font-size:16px;font-weight:700;color:#0f172a;">Sistema de Militância São José</h2>
        <p style="margin:0;font-size:13px;color:#64748b;">Carregando módulos e painel de controle...</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
